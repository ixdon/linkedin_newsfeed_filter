<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <style>
    .settings-container{
      background-color:#CCCCCC;
      font-size: large;
      width:500px;
      display:flex;
    }
    .settings-main{
      width:475px;
    }
    .tooltip{
      width:25px;
      user-select:none;
      cursor:help;
    }
  </style>
  </head>
  <body>
    <h1>Extension settings</h1>
    <div id="tip-container" style="width:500px;background-color:#EEEEEE;font-size: large;">
      <div id="tip-header" style="display:flex;">
        This is settings page for the extension.
        <br>
        Here you can select your keywords, highlight color and delay
        <br>
        For now, this page is not localized yet.
    </div>
    <br>
    <div id="delay-container" class="settings-container">
      <div id="delay-main" style="width:480px;">
      Delay (ms):
        <input type="number" id="hide-delay" value="500"></input>
      </div>
    <div class="tooltip" title="Delay in ms for hiding a post after it appears.&#10;Without such a delay, posts would be hidden incorrectly">ℹ️</div>
    </div>

    <br>
    <div id="highlight-color-container" class="settings-container">
      <div id="highlight-color-main" class="settings-main">
        Color for highlighting posts:
        <input type="text" id="highlight-color" style="width:80px;"value="#CCFFCC"></input>
        <div id="highlight-example" style="width:500px;background-color:#CCFFCC">(this color)</div>
      </div>
      <div class="tooltip" title="Color for highlighting post's header if it contains a keyword..&#10;May be either color name (green, magenta, blue) or RBG-encoded:.&#10;#RRGGBB.&#10;Default value: #CCFFCC (light green)">ℹ️</div>
    </div>   
    <br> 
    <div id="keywords-container" style="font-size: large;width:500px;">
      <div id="keywords-explainer" class="settings-container">
        <div id="keywords-main" class="settings-main">Your keywords:</div>
        <div class="tooltip" title="If a post contains any of these keywords anywhere, it will be highlighted">ℹ️</div>
      </div>
    </div>

    <button id="new">New keyword</button>
    <br>
    <br>
    <div id="button-container">
      <button id="apply">Apply settings</button>
      <button id="reset">Reset settings</button>
    </div>
    <div id="status">
    </div>
    <script src="settings.js"></script>
  </body>
</html>
